# Render Blueprint — static frontend + SPA fallback.
# Dashboard: New → Blueprint → select repo. Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: dscet-it-hub
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
